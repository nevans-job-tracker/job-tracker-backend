[pytest]
testpaths = tests

# Reports are written on every run so they can't go stale:
#   htmlcov/index.html    — line-by-line coverage
#   report.html           — which tests ran and passed
# Skip them with: pytest -o addopts='-q'
# Not with -p no:html — that removes the plugin but not the --html flag
# below, so pytest rejects its own arguments and runs nothing.
addopts =
    -q
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --html=report.html
    --self-contained-html

filterwarnings =
    ignore::DeprecationWarning
